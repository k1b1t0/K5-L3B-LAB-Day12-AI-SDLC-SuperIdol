<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — SuperIdol Edition</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1218; color: #e8eef2; font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #mute-btn {
    position: fixed; top: 12px; right: 14px; z-index: 10;
    background: rgba(16, 24, 32, 0.75); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #e8eef2; border-radius: 8px; padding: 6px 12px; font-size: 13px;
    cursor: pointer; backdrop-filter: blur(4px); transition: all .2s;
  }
  #mute-btn:hover { background: rgba(30, 45, 60, 0.9); border-color: rgba(255, 255, 255, 0.5); }
</style>
</head>
<body>
<button id="mute-btn" title="Nhấn M để bật/tắt âm thanh">🔊 Âm thanh: BẬT [M]</button>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — SuperIdol Web Client (Thành viên D — Lê Thành Nguyên).
 * CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Tính năng sáng tạo (WebAudio, HUD Thực đơn, Particle, Floating Text) 100% độc lập, không ảnh hưởng headless.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- Âm thanh tự tổng hợp (Web Audio API) ----------
let audioCtx = null;
let soundMuted = false;
const muteBtn = document.getElementById("mute-btn");

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function toggleMute() {
  soundMuted = !soundMuted;
  if (muteBtn) muteBtn.textContent = soundMuted ? "🔇 Âm thanh: TẮT [M]" : "🔊 Âm thanh: BẬT [M]";
}
if (muteBtn) muteBtn.onclick = () => { initAudio(); toggleMute(); };

function playTone(freq, type, duration, gainVal = 0.15) {
  if (soundMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function sfxDive() {
  if (soundMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(65, audioCtx.currentTime + 0.25);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function sfxSurface() {
  if (soundMuted || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(320, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

function sfxDing() {
  if (soundMuted || !audioCtx) return;
  playTone(880, "sine", 0.45, 0.2);
  setTimeout(() => playTone(1760, "sine", 0.3, 0.1), 50);
}

function sfxCoin() {
  if (soundMuted || !audioCtx) return;
  playTone(987, "sine", 0.15, 0.2);
  setTimeout(() => playTone(1318, "sine", 0.35, 0.25), 80);
}

function sfxChoke() {
  if (soundMuted || !audioCtx) return;
  playTone(70, "sawtooth", 0.3, 0.3);
}

function sfxCatch() {
  if (soundMuted || !audioCtx) return;
  playTone(440, "triangle", 0.18, 0.2);
}

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

// Màn hình phía client (không ảnh hưởng luật): menu chính -> chơi; intro/result phủ lên và giữ sim ở pause.
let screen = "menu";          // menu | play | quit
let menuSel = 0;              // 0 = Chơi, 1 = Thoát
let intro = null;             // {kind: "day"|"evening"|"result", until: ms, data}
let userPaused = false;       // Esc/P
let lastPausePress = 0;

function curPhase() { return snap ? (snap.phase || snap.mode) : "gather"; }
function currentInput() {
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (curPhase() === "quan") dy = -dy;                          // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
function sendOnce(obj) { queue.push(JSON.stringify(obj)); flush(); }
function press(button) { sendOnce({ [button]: true }); sendOnce({ [button]: false }); }  // một cạnh lên
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối */ }
  }
  inflight = false;
}
// Đồng bộ pause của sim với điều client muốn (menu, intro, Esc/P). Chờ snapshot cập nhật rồi mới bấm lại.
function syncPause() {
  if (!snap || snap.finished || snap.state === "finished") return;
  const want = screen !== "play" || intro !== null || userPaused;
  if ((snap.state === "paused") !== want && performance.now() - lastPausePress > 300) {
    lastPausePress = performance.now();
    press("pause");
  }
}
function startGame() {
  fetch("/restart", { method: "POST" });
  lastSent = ""; down.clear(); resetClient();
  screen = "play"; userPaused = false; intro = null;
  lastPausePress = performance.now() + 300;   // chờ snapshot của lượt mới rồi mới đồng bộ pause
}
function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  initAudio();
  const k = keyName(e);
  if (k === "m") { toggleMute(); e.preventDefault(); return; }
  if (k === "h") { highContrast = !highContrast; return; }
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (screen === "menu") {
    if (MOVE_KEYS[k] === "u" || MOVE_KEYS[k] === "d") menuSel = 1 - menuSel;
    else if (k === "enter" || k === " " || k === "e") { if (menuSel === 0) startGame(); else screen = "quit"; }
    else if (k === "q") screen = "quit";
    e.preventDefault(); return;
  }
  if (screen === "quit") { if (k === "enter") screen = "menu"; return; }
  if (intro) { intro = null; e.preventDefault(); return; }            // phím bất kỳ: qua màn giới thiệu
  if (snap && snap.finished && snap.reason === "days_complete") {     // Summary
    if (k === "enter" || k === "q") screen = "menu";
    return;
  }
  if (k === "escape" || k === "p") { userPaused = !userPaused; e.preventDefault(); return; }
  if (userPaused) { if (k === "q") { userPaused = false; screen = "menu"; } return; }
  if (curPhase() === "shop") {
    const ups = Object.keys((snap && snap.shop_upgrades) || {}).sort();
    const idx = parseInt(k, 10) - 1;
    if (idx >= 0 && idx < ups.length) sendOnce({ buy: ups[idx] });
    else if (k === "enter") press("shop_done");
    return;
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { startGame(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- Floating Texts & Sound trigger theo sự kiện ----------
const floatTexts = [];
let seenEv = new Set(), lastSnapTick = -1;
let dayStats = null, runStats = null;

function newDayStats() { return { served: 0, left: 0, tips: 0, money0: snap ? snap.money : 0, rep0: snap ? snap.reputation : 0 }; }
function resetClient() { seenEv = new Set(); lastSnapTick = -1; dayStats = null; runStats = { sold: {}, served: 0, left: 0 }; floatTexts.length = 0; }
resetClient();

function addFloatText(text, x, y, color = "#ffd54f") {
  floatTexts.push({ text, x, y, color, life: 60, maxLife: 60 });
}

function processEvents(events) {
  if (!events || !events.length) return;
  if (snap.tick < lastSnapTick) resetClient();   // server đã restart
  lastSnapTick = snap.tick;
  const ord = {};
  for (const e of events) {
    ord[e.tick] = (ord[e.tick] || 0) + 1;
    const key = e.tick + ":" + ord[e.tick];       // nhiều event cùng tick: phân biệt theo thứ tự
    if (seenEv.has(key)) continue;
    seenEv.add(key);
    handleEvent(e);
  }
  if (seenEv.size > 400) seenEv = new Set([...seenEv].filter((k) => +k.split(":")[0] >= snap.tick - 120));
}

function handleEvent(e) {
  const name = e.name, data = e.data || {};
  const cx = cv.width / (window.devicePixelRatio || 1) / 2, cy = cv.height / (window.devicePixelRatio || 1) / 2;
  if (name === "dive") sfxDive();
  else if (name === "surface") sfxSurface();
  else if (name === "fish_caught") { sfxCatch(); addFloatText("🐟 Bắt trúng cá!", cx, cy, "#4fc3f7"); }
  else if (name === "gather") { sfxCatch(); addFloatText("🌿 Hái thành công", cx, cy, "#81c784"); }
  else if (name === "hold_full") { playTone(180, "sawtooth", 0.25, 0.25); addFloatText("⚠ ĐẦY GIỎ!", cx, cy - 30, "#ff5252"); }
  else if (name === "choke") { sfxChoke(); addFloatText("💔 NGẠT OXY! -1 Máu", cx, cy - 40, "#ff1744"); }
  else if (name === "monster_hit") {
    sfxChoke();
    addFloatText(`🐊 Cá Sấu cắn! -1 Máu${(data.lost || []).length ? ", rơi " + data.lost.length + " món" : ""}`, cx, cy - 40, "#ce93d8");
  } else if (name === "faint") { sfxChoke(); addFloatText("😵 Ngất! Mất cả giỏ", cx, cy - 60, "#ff1744"); }
  else if (name === "dish_ready") { sfxDing(); addFloatText("🔔 Món đã chín!", cx, cy - 20, "#69f0ae"); }
  else if (name === "served") {
    sfxCatch(); addFloatText("🍲 Đã phục vụ khách", cx, cy - 20, "#e040fb");
    if (dayStats) dayStats.served++;
    runStats.served++; runStats.sold[data.dish_id] = (runStats.sold[data.dish_id] || 0) + 1;
  } else if (name === "paid") {
    sfxCoin();
    const tipStr = data.tip > 0 ? ` (+Tip ${data.tip}k!)` : "";
    addFloatText(`💰 +${data.amount ?? ((data.base_price || 0) + (data.tip || 0))}k${tipStr}`, cx, cy - 30, "#ffd700");
    if (dayStats) dayStats.tips += data.tip || 0;
  } else if (name === "customer_left") {
    playTone(130, "sawtooth", 0.35, 0.25);
    addFloatText(data.reason === "closing" ? "🚪 Khách về (đóng ca)" : "🚪 Khách bỏ về! -Uy tín", cx, cy - 30, "#ff5252");
    if (dayStats && data.reason !== "closing") dayStats.left++;
    if (data.reason !== "closing") runStats.left++;
  } else if (name === "bought") { sfxCoin(); addFloatText(`🛒 Đã mua ${UPGRADE_NAME[data.upgrade] || data.upgrade} cấp ${data.level}`, cx, cy, "#69f0ae"); }
  else if (name === "buy_failed") {
    playTone(180, "sawtooth", 0.25, 0.25);
    const why = { funds: "không đủ tiền", max_level: "đã tối đa", unknown: "không hỗ trợ" }[data.reason] || data.reason;
    addFloatText(`✖ Không mua được: ${why}`, cx, cy, "#ff5252");
  } else if (name === "day_start") { intro = { kind: "day", until: performance.now() + 4000, day: e.day }; }
  else if (name === "phase_start" && e.phase === "quan") {
    dayStats = newDayStats();
    intro = { kind: "evening", until: performance.now() + 4000 };
  } else if (name === "phase_start" && e.phase === "shop") {
    intro = { kind: "result", until: performance.now() + 6000, stats: Object.assign({}, dayStats || newDayStats()) };
  }
}

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    if (snap && snap.events) processEvents(snap.events);
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = {
  ca_loc: "#558b2f", ca_linh: "#81d4fa", ca_keo: "#ffb74d",
  bong_dien_dien: "#ffd600", bong_sung: "#f06292", keo_neo: "#aed581"
};
const KIND_NAME = {
  ca_loc: "Cá lóc", ca_linh: "Cá linh", ca_keo: "Cá kèo",
  bong_dien_dien: "Điên điển", bong_sung: "Bông súng", keo_neo: "Kèo nèo"
};
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc",
  ca_keo_nuong: "Cá kèo nướng",
  lau_mam: "Lẩu mắm miền Tây"
};
const UPGRADE_NAME = { oxygen: "Bình oxy", hp: "Áo phao" };
const MIN_FONT = 18;          // HUD: chữ không chân ≥ 18 px ở 1280×720
let highContrast = false;     // H: tương phản cao
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.bold ? "bold " : "") + Math.max(MIN_FONT, o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = highContrast ? (o.color === "#102027" ? "#000" : "#fff") : (o.color || "#e8eef2");
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { align: "center", bold: true });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 50 ? s.slice(0, 47) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).filter((e) => e.name !== "paused" && e.name !== "resumed").slice(-4);
  ev.forEach((e, i) => {
    text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 14, h - 70 - (ev.length - 1 - i) * 22, {
      size: 11, align: "right", color: "rgba(232,238,242,.75)"
    });
  });
}
function panel(w, h, pw, ph, border = "#4fc3f7") {
  const x = w / 2 - pw / 2, y = h / 2 - ph / 2;
  ctx.fillStyle = "rgba(10,16,22,0.92)"; ctx.fillRect(x, y, pw, ph);
  ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.strokeRect(x, y, pw, ph);
  return [x, y];
}
function dim(w, h) { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, w, h); }
function kindList(m) {
  return Object.keys(m || {}).sort().map((k) => (KIND_NAME[k] || k) + " ×" + m[k]).join(", ") || "(không có)";
}
function cookable(menu, stock, only) {
  return Object.keys(menu || {}).filter((d) => !only || d in only).filter((d) =>
    Object.entries(menu[d].recipe).every(([k, n]) => (stock[k] || 0) >= n));
}
function overlay(w, h) {
  if (offline) {
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, w, 60);
    text("Mất kết nối tới máy chủ (đã tắt python -m chonoi.live chưa?)", w / 2, 35, { align: "center", color: "#ff8a80", size: 16, bold: true });
  }
  if (snap.error) text("Lỗi: " + snap.error + " (Nhấn R để chơi lại)", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished && snap.reason === "days_complete") {        // Summary sau Ngày cuối
    dim(w, h);
    const [x, y] = panel(w, h, 560, 300, "#ffd54f");
    const best = Object.entries(runStats.sold).sort((a, b) => b[1] - a[1])[0];
    text("🏆 TỔNG KẾT CHUYẾN CHỢ NỔI", w / 2, y + 44, { align: "center", size: 24, bold: true, color: "#ffd54f" });
    text(`Số Ngày: ${snap.days_completed ?? snap.day}`, x + 40, y + 94);
    text(`Tổng tiền thu (earned): ${snap.earned}k · Tiền còn: ${snap.money}k`, x + 40, y + 126);
    text(`Uy tín: ${(snap.reputation ?? 0).toFixed(1)} · Tổng điểm: ${snap.score}`, x + 40, y + 158);
    text(`Món bán chạy: ${best ? (DISH_NAME[best[0]] || best[0]) + " (" + best[1] + " suất)" : "chưa bán món nào"}`, x + 40, y + 190);
    text(`Khách phục vụ: ${runStats.served} · Khách bỏ đi: ${runStats.left}`, x + 40, y + 222);
    text("[Enter] Về menu", w / 2, y + 274, { align: "center", color: "#81d4fa" });
    return;
  }
  if (snap.finished) {
    ctx.fillStyle = "rgba(10,16,22,0.85)"; ctx.fillRect(w / 2 - 230, h / 2 - 60, 460, 120);
    ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 230, h / 2 - 60, 460, 120);
    text("Buổi " + (curPhase() === "gather" ? "sáng (Lặn & Hái)" : "tối (Mở Quán)") + " kết thúc!", w / 2, h / 2 - 18, { align: "center", size: 20, bold: true, color: "#ffd54f" });
    text("Lý do: " + (snap.reason || ""), w / 2, h / 2 + 10, { align: "center", size: 14, color: "#e8eef2" });
    text("Nhấn phím [R] để chơi lại màn chơi", w / 2, h / 2 + 38, { align: "center", color: "#81d4fa", size: 13 });
    return;
  }
  if (intro && performance.now() > intro.until) intro = null;
  if (intro) {
    dim(w, h);
    if (intro.kind === "day") {
      const plan = snap.day_plan || {};
      const [x, y] = panel(w, h, 620, 260, "#ffd54f");
      text(`☀ NGÀY ${intro.day || snap.day}`, w / 2, y + 46, { align: "center", size: 26, bold: true, color: "#ffd54f" });
      text("Má Tư dặn: hôm nay nấu", x + 30, y + 90, { color: "#81d4fa" });
      text(Object.entries(plan.dishes || {}).map(([d, n]) => (DISH_NAME[d] || d) + " ×" + n).join(", "), x + 30, y + 120);
      text("Cần lấy: " + kindList(plan.ingredients), x + 30, y + 160, { color: "#a5d6a7" });
      text("Nhấn phím bất kỳ để bắt đầu", w / 2, y + 226, { align: "center", color: "#90a4ae" });
    } else if (intro.kind === "evening") {
      const stock = snap.stock || {};
      const ok = cookable(snap.menu, stock, snap.day_plan && snap.day_plan.dishes);
      const [x, y] = panel(w, h, 620, 240, "#ff7043");
      text("🌙 BUỔI TỐI — MỞ QUÁN", w / 2, y + 46, { align: "center", size: 24, bold: true, color: "#ffab91" });
      text("Nhập kho: " + kindList(stock), x + 30, y + 96);
      text("Nấu được: " + (ok.map((d) => DISH_NAME[d] || d).join(", ") || "không món nào"), x + 30, y + 136, { color: "#a5d6a7" });

}

// ---------- cảnh GATHER: nhìn ngang, x sang phải, d xuống ----------
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 70, bottom = 60;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Bầu trời
  const skyGrad = ctx.createLinearGradient(0, top, 0, oy);
  skyGrad.addColorStop(0, "#87ceeb"); skyGrad.addColorStop(1, "#e0f7fa");
  ctx.fillStyle = skyGrad; ctx.fillRect(0, top, w, SKY * s);

  // Mặt trời mọc sông nước
  ctx.fillStyle = "rgba(255, 235, 150, 0.6)";
  ctx.beginPath(); ctx.arc(sx(X * 0.8), top + 2 * s, 1.8 * s, 0, Math.PI * 2); ctx.fill();

  // Dòng sông Chợ Nổi (gradient độ sâu)
  const riverGrad = ctx.createLinearGradient(0, oy, 0, sy(D));
  riverGrad.addColorStop(0, "#29b6f6");
  riverGrad.addColorStop(0.35, "#0288d1");
  riverGrad.addColorStop(1, "#011f38");
  ctx.fillStyle = riverGrad; ctx.fillRect(sx(0), oy, X * s, D * s);

  // Tia nắng dưới nước (Mekong Delta morning rays)
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.04)";
  for (let i = 0; i < 6; i++) {
    ctx.beginPath();
    ctx.moveTo(sx(X * (0.2 + i * 0.14)), oy);
    ctx.lineTo(sx(X * (0.28 + i * 0.14)), sy(D));
    ctx.lineTo(sx(X * (0.16 + i * 0.14)), sy(D));
    ctx.fill();
  }
  ctx.restore();

  // Vạch mặt nước lăn tăn
  ctx.strokeStyle = "#e1f5fe"; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(sx(0), oy);
  for (let x = 0; x <= X; x += 2) {
    const wy = oy + Math.sin(x * 0.8 + Date.now() * 0.003) * 1.5;
    ctx.lineTo(sx(x), wy);
  }
  ctx.stroke();

  // Thước đo độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.09)"; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 6, sy(d) - 3, { size: 10, color: "rgba(255,255,255,.45)" });
  }

  // Bến Ghe Xuồng Chợ Nổi
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  // Vùng neo đậu (vòng tròn đứt nét)
  ctx.strokeStyle = "rgba(255, 215, 64, 0.7)"; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  // Thân ghe gỗ
  ctx.fillStyle = "#6d4c41"; ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.2), sy(-0.2));
  ctx.lineTo(sx(dp[0] + 2.2), sy(-0.2));
  ctx.lineTo(sx(dp[0] + 1.8), sy(0.8));
  ctx.lineTo(sx(dp[0] - 1.8), sy(0.8));
  ctx.closePath(); ctx.fill();
  // Mái bạt che nắng vàng cam
  ctx.fillStyle = "#ff7043"; ctx.beginPath();
  ctx.moveTo(sx(dp[0] - 2.0), sy(-0.2));
  ctx.lineTo(sx(dp[0]), sy(-2.5));
  ctx.lineTo(sx(dp[0] + 2.0), sy(-0.2));
  ctx.fill();
  text("🛶 BẾN XUỒNG", sx(dp[0]), sy(-2.9), { size: 11, align: "center", bold: true, color: "#ffab00" });

  // Nút hái cây cỏ (Bông điên điển, Bông súng)
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath();
    ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 1;
    text(KIND_NAME[n.kind] || n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#102027", bold: true });
    if (!ready && n.regrow_ticks) {
      text("mọc lại: " + Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.2 * s, { size: 10, align: "center", color: "#e0e0e0" });
    }
  });

  // Đàn cá bơi lội
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1]));
    ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    // Thân cá
    ctx.beginPath(); ctx.ellipse(0, 0, 0.95 * s, 0.48 * s, 0, 0, Math.PI * 2); ctx.fill();
    // Đuôi cá
    ctx.beginPath(); ctx.moveTo(-0.85 * s, 0); ctx.lineTo(-1.45 * s, -0.45 * s); ctx.lineTo(-1.45 * s, 0.45 * s); ctx.fill();
    // Mắt cá
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(0.55 * s, -0.15 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  // Cá Sấu Năm Chèo (thủy quái)
  let monsterNear = false;
  const species = (meta.monsters && meta.monsters.species) || {};
  (snap.monsters || []).forEach((m) => {
    ctx.fillStyle = m.state === "recoil" ? "#9575cd" : "#4a148c";
    ctx.beginPath(); ctx.ellipse(sx(m.pos[0]), sy(m.pos[1]), 1.6 * s, 0.6 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e1bee7"; ctx.lineWidth = 2; ctx.stroke();
    text("🐊", sx(m.pos[0]), sy(m.pos[1]) + 6, { align: "center" });
    const sp = species[m.kind] || {};
    if (snap.player && Math.hypot(snap.player.pos[0] - m.pos[0], snap.player.pos[1] - m.pos[1]) <= (sp.detect_radius || 10)) monsterNear = true;
  });

  // Nhân vật Út Sen
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;

    // Vòng tương tác
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = "rgba(79, 195, 247, 0.45)"; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = "rgba(255, 215, 64, 0.55)"; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
    }

    // Vẽ người Út Sen (nhấp nháy khi bất tử sau cú cắn)
    ctx.globalAlpha = p.invuln_ticks > 0 && Math.floor(Date.now() / 120) % 2 ? 0.4 : 1;
    ctx.fillStyle = "#ff7043"; ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();

    // Hướng nhìn
    const a = ((p.heading_deg || 0) * Math.PI) / 180;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * s, py + Math.sin(a) * s); ctx.stroke();

    // Nhãn Út Sen
    ctx.globalAlpha = 1;
    text("Út Sen", px, py - 0.85 * s, { size: 11, align: "center", color: "#fff", bold: true });

    // Gợi ý phím thao tác ngữ cảnh
    if (!underwater) {
      const inDock = Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= dr;
      if (inDock) {
        text("[E] CẬP BẾN", px, py + 1.25 * s, { size: 11, align: "center", color: "#ffd54f", bold: true });
      } else {
        const canHarvest = (snap.nodes || []).some((n) => n.ready !== false && Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) <= (meta.interact_radius || 2));
        if (canHarvest) text("[E] HÁI NGUYÊN LIỆU", px, py + 1.25 * s, { size: 11, align: "center", color: "#69f0ae", bold: true });
      }
    } else {
      const canCatch = p.catch_cd_ticks === 0 && (snap.fish || []).some((f) => Math.hypot(p.pos[0] - f.pos[0], p.pos[1] - f.pos[1]) <= (meta.catch_radius || 2));
      if (canCatch) text("[SPACE] BẮT CÁ", px, py + 1.25 * s, { size: 11, align: "center", color: "#4fc3f7", bold: true });
    }
  }

  // Cảnh báo viền đỏ nhấp nháy khi Oxy nguy cấp (<25% hoặc choke)
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const isCritical = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    if (isCritical && Math.floor(Date.now() / 250) % 2 === 0) {
      ctx.strokeStyle = "rgba(255, 23, 68, 0.65)"; ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, w - 8, h - 8);
    }
  }

  // Cảnh báo thủy quái: chữ + viền tím
  if (monsterNear) {
    ctx.strokeStyle = "rgba(171, 71, 188, 0.8)"; ctx.lineWidth = 8; ctx.strokeRect(12, 12, w - 24, h - 24);
    text("⚠ Thủy quái!", w / 2, 100, { align: "center", size: 24, bold: true, color: "#e040fb" });
  }
  if (p && p.oxygen_ticks === 0 && p.pos[1] > 0.5) text("Hết hơi!", w / 2, 130, { align: "center", size: 24, bold: true, color: "#ff1744" });

  // HUD trên màn hình
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, bold: true, color: snap.time_left_ticks <= 1800 ? "#ff5252" : undefined });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const frac = p.oxygen_ticks / p.oxygen_max_ticks;
    const blink = frac < 0.25 && Math.floor(Date.now() / 250) % 2 === 0;
    const col = frac < 0.25 ? (blink ? "#ffeb3b" : "#ff1744") : frac < 0.5 ? "#ffa726" : "#29b6f6";
    bar(110, 10, 220, 22, frac, col, "Oxy: " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
    text(hs, 345, 28, { size: 22, color: "#ff5252" });
  }
  if (snap.day) text(`Ngày ${snap.day} · Tiền ${snap.money}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)}`, 500, 28, { bold: true, color: "#ffd54f" });
  // Danh sách cần lấy (đã lấy / cần)
  if (snap.day_plan && snap.day_plan.ingredients) {
    const have = {}; (snap.hold || []).forEach((k) => (have[k] = (have[k] || 0) + 1));
    const need = snap.day_plan.ingredients, kinds = Object.keys(need).sort();
    const x0 = w - 260, y0 = 74;
    ctx.fillStyle = "rgba(10,16,22,.7)"; ctx.fillRect(x0, y0, 246, 34 + kinds.length * 24);
    text("Cần lấy", x0 + 10, y0 + 24, { bold: true, color: "#81d4fa" });
    kinds.forEach((k, i) => {
      const ok = (have[k] || 0) >= need[k];
      text(`${ok ? "✔" : "·"} ${KIND_NAME[k] || k}: ${have[k] || 0}/${need[k]}`, x0 + 10, y0 + 50 + i * 24, { color: ok ? "#69f0ae" : "#eceff1" });
    });
  }
  if (p && p.pos) text(`Độ sâu: ${p.pos[1].toFixed(1)} m · x=${p.pos[0].toFixed(1)}`, 14, 56, { size: 12, color: "#b0bec5" });
  text(p && p.catch_cd_ticks > 0 ? `Hồi bắt: ${(p.catch_cd_ticks / 60).toFixed(1)}s` : "Bắt cá: sẵn sàng", 300, 56, { size: 12, color: "#81d4fa" });

  // Khoang chứa (Giỏ LIFO dưới đáy)
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(28, (w - 280) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fillRect(x0, y0, sz, sz);
      ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.strokeRect(x0, y0, sz, sz);
      if (snap.hold[i]) {
        ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
      }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    const invStr = Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", ");
    text(`🧺 Giỏ LIFO (${snap.hold.length}/${cap}): ${invStr || "(trống)"}`, 14, y0 + sz + 15, { size: 12, color: "#eceff1", bold: true });
  }
  text("WASD bơi · E hái/cập bến · Space bắt cá · Esc tạm dừng", w - 14, 56, { size: 12, align: "right", color: "#90a4ae" });
}

// ---------- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) ----------
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 380) / X, (h - top - bottom) / Z));
  const ox = 30, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Sàn thuyền nhà hàng Chợ Nổi (gỗ ván)
  ctx.fillStyle = "#8d6e63"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#4e342e"; ctx.lineWidth = 5; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Vân sàn gỗ
  ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1;
  for (let z = 1; z < Z; z++) {
    ctx.beginPath(); ctx.moveTo(sx(0), sy(z)); ctx.lineTo(sx(X), sy(z)); ctx.stroke();
  }

  // Bếp nấu (Bếp lò đất nung miền Tây)
  (snap.stoves || []).forEach((st) => {
    const isCooking = st.state === "cooking";
    const isReady = st.state === "ready";
    ctx.fillStyle = isReady ? "#43a047" : isCooking ? "#e65100" : "#5d4037";
    ctx.fillRect(sx(st.pos[0]) - 0.85 * s, sy(st.pos[1]) - 0.85 * s, 1.7 * s, 1.7 * s);
    ctx.strokeStyle = isReady ? "#a5d6a7" : isCooking ? "#ffb74d" : "#8d6e63";
    ctx.lineWidth = 2; ctx.strokeRect(sx(st.pos[0]) - 0.85 * s, sy(st.pos[1]) - 0.85 * s, 1.7 * s, 1.7 * s);

    text("🔥 " + st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#fff", bold: true });
    if (st.dish) {
      const did = typeof st.dish === "string" ? st.dish : st.dish.dish_id;
      text(DISH_NAME[did] || did, sx(st.pos[0]), sy(st.pos[1]) - 1.05 * s, { size: 10, align: "center", color: "#ffe082", bold: true });
    }
    if (isCooking && st.cook_ticks_left !== undefined) {
      text("Chín sau: " + Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, { size: 10, align: "center", color: "#ffcc80" });
    } else if (isReady) {
      text("MÓN ĐÃ CHÍN!", sx(st.pos[0]), sy(st.pos[1]) + 1.35 * s, { size: 10, align: "center", color: "#b9f6ca", bold: true });
    }
  });

  // Bàn ăn gỗ tròn + Khách hàng
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));

  (snap.tables || []).forEach((tb) => {
    // Mặt bàn gỗ
    ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.95 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 2; ctx.stroke();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff", bold: true });

    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.6 * s;
      const isEating = c.state === "eating";
      // Avatar khách
      ctx.fillStyle = isEating ? "#66bb6a" : "#f06292"; ctx.beginPath(); ctx.arc(cx, cy, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke();
      text(isEating ? "😋" : "👤", cx, cy + 4, { size: 12, align: "center" });

      // Món khách gọi
      const dName = DISH_NAME[c.dish_id] || c.dish_id;
      text(dName, cx, cy - 0.85 * s, { size: 10, align: "center", color: "#ffd54f", bold: true });

      // Thanh kiên nhẫn (Đổi màu Xanh -> Vàng -> Đỏ + mốc tip 50%)
      if (c.patience_ticks_left !== undefined && !isEating) {
        const frac = c.patience_ticks_left / patMax;   // < 25%: đỏ
        const col = frac > 0.5 ? "#4caf50" : frac > 0.25 ? "#ffa726" : "#f44336";
        bar(cx - 0.9 * s, cy + 0.75 * s, 1.8 * s, 6, frac, col);
        // Vạch mốc tip (50%)
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(cx, cy + 0.75 * s); ctx.lineTo(cx, cy + 0.75 * s + 6); ctx.stroke();
      } else if (isEating && c.eat_ticks_left !== undefined) {
        text("Đang ăn...", cx, cy + 1.15 * s, { size: 10, align: "center", color: "#81c784" });
      }
    }
  });

  // Nhân vật Út Sen chạy bàn
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255,255,255,.4)"; ctx.setLineDash([4, 4]); ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.fillStyle = "#ff7043"; ctx.beginPath(); ctx.arc(px, py, 0.55 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
    text("Út Sen", px, py + 1.15 * s, { size: 10, align: "center", color: "#fff" });

    // Món cầm trên tay
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + (DISH_NAME[hand] || hand), px, py - 0.85 * s, { size: 11, align: "center", color: "#ffd54f", bold: true });
    }
  }

  // BẢNG THỰC ĐƠN & KHO KHẢ DỤNG Ở GÓC PHẢI (đọc menu từ dữ liệu, day: chỉ món trong kế hoạch)
  const menu = snap.menu || {}, avail = snap.available || snap.stock || {};
  const only = snap.day_plan && snap.day_plan.dishes;
  const dishes = Object.keys(menu).filter((d) => !only || d in only);
  const ok = new Set(cookable(menu, avail, only));
  const hudX = w - 330, ph = 70 + dishes.length * 50 + 40 + Math.max(1, Object.keys(avail).length) * 24;
  ctx.fillStyle = "rgba(20, 28, 38, 0.88)"; ctx.fillRect(hudX, top, 316, ph);
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 1; ctx.strokeRect(hudX, top, 316, ph);
  text("📜 THỰC ĐƠN", hudX + 158, top + 28, { bold: true, align: "center", color: "#81d4fa" });
  dishes.forEach((d, idx) => {
    const ry = top + 44 + idx * 50, can = ok.has(d);
    ctx.fillStyle = can ? "rgba(76, 175, 80, 0.18)" : "rgba(255, 255, 255, 0.05)";
    ctx.fillRect(hudX + 8, ry, 300, 46);
    text(`${DISH_NAME[d] || d} ${menu[d].price}k`, hudX + 14, ry + 20, { bold: true, color: can ? "#a5d6a7" : "#b0bec5" });
    text(kindList(menu[d].recipe), hudX + 14, ry + 42, { color: "#90a4ae" });
  });
  const ky = top + 70 + dishes.length * 50;
  text("KHO KHẢ DỤNG:", hudX + 14, ky, { bold: true, color: "#ffb74d" });
  const ak = Object.keys(avail).sort();
  if (!ak.length) text("Kho rỗng", hudX + 14, ky + 26, { color: "#cfd8dc" });
  ak.forEach((k, i) => text(`${KIND_NAME[k] || k}: ${avail[k]}`, hudX + 14, ky + 26 + i * 24, { color: "#cfd8dc" }));

  // HUD Top Bar
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, bold: true, color: snap.time_left_ticks <= 1800 ? "#ff5252" : undefined });
  const shift = dayStats ? ` · Tiền ca: ${(snap.money ?? 0) - dayStats.money0}k` : "";
  text(`${snap.day ? "Ngày " + snap.day + " · " : ""}Tiền: ${snap.money ?? 0}k${shift} · Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5 · Điểm: ${snap.score ?? 0}`, 110, 28, { bold: true, color: "#ffd54f" });
  text("WASD đi · E bếp/bàn · Esc tạm dừng · M âm thanh", w - 14, h - 14, { align: "right", color: "#90a4ae" });
}

// ---------- Vẽ các chữ số bay (Floating Texts) ----------
function drawFloatingTexts() {
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const ft = floatTexts[i];
    const alpha = Math.max(0, ft.life / ft.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = "bold 18px system-ui, sans-serif";
    ctx.fillStyle = ft.color;
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
    ft.y -= 0.8;
    ft.life -= 1;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000" : "#0c1218"; ctx.fillRect(0, 0, w, h);
  if (screen !== "play") {
    drawMenu(w, h);
    syncPause();
  } else if (snap) {
    const ph = curPhase();
    if (ph === "quan") drawQuan(w, h); else if (ph === "shop") drawShop(w, h); else drawGather(w, h);
    drawFloatingTexts();
    eventLog(w, h);
    overlay(w, h);
    syncPause();
  } else {
    text(offline ? "Không kết nối được máy chủ live..." : "Đang tải dữ liệu...", w / 2, h / 2, { align: "center", size: 18, color: "#90a4ae" });
  }
}
requestAnimationFrame(frame);
</script>
